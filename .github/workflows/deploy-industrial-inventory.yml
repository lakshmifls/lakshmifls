name: Deploy Industrial Inventory Marketplace

on:
  push:
    branches:
      - main
    paths:
      - "industrial-inventory-marketplace/**"
      - ".github/workflows/deploy-industrial-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload marketplace site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "industrial-inventory-marketplace"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
